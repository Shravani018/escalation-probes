[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "escalation-probes"
version = "0.1.0"
description = "Single-turn representation probes versus multi-turn escalation in small open-weight models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=4.45",
    "accelerate",
    "bitsandbytes",
    "scikit-learn",
    "numpy",
    "pandas",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]
judge = ["anthropic"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
